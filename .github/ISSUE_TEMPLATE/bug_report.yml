name: Bug report
description: Report a reproducible problem
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    attributes:
      label: What happened?
      description: Explain the observed behavior and expected behavior.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Reproduction
      description: Give the smallest reproducible setup or steps.
    validations:
      required: true
  - type: input
    attributes:
      label: Version
      placeholder: "1.1.0"
    validations:
      required: true
  - type: textarea
    attributes:
      label: Logs
      description: Remove tokens, passwords, personal data, and other secrets.
