[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "telegram-bot-platform"
version = "2.2.0"
description = "A production-grade, domain-neutral Telegram bot platform with preserved feature parity and a modern typed architecture."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
authors = [{ name = "KouchakiDev" }]
keywords = ["telegram", "telegram-bot", "python", "fastapi", "mini-app", "automation", "asyncio", "modular"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Communications",
  "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://github.com/KouchakiDev/telegram-bot-platform"
Repository = "https://github.com/KouchakiDev/telegram-bot-platform"
Issues = "https://github.com/KouchakiDev/telegram-bot-platform/issues"

# Modern runtime: the supported, typed application layer.
dependencies = [
  "alembic>=1.18,<2",
  "aiomysql>=0.2,<1",
  "aiosqlite>=0.21,<1",
  "asyncpg>=0.30,<1",
  "fastapi>=0.128,<1",
  "itsdangerous>=2.2,<3",
  "pydantic>=2.13,<3",
  "pydantic-settings>=2.14,<3",
  "python-multipart>=0.0.20,<1",
  "python-telegram-bot[rate-limiter]>=22.8,<23",
  "sqlalchemy>=2.0.50,<3",
  "uvicorn[standard]>=0.40,<1",
]

# The preserved production feature set is optional so the modern core stays small.
[project.optional-dependencies]
legacy = [
  "APScheduler>=3.11.3,<4",
  "Pillow>=11.3,<13",
  "XlsxWriter>=3.2,<4",
  "PyTelegramBotAPI>=4.37,<5",
  "Telethon>=1.45,<2",
  "arabic-reshaper>=3,<4",
  "colorama>=0.4,<1",
  "jdatetime>=5.2,<6",
  "pandas>=2.2,<3",
  "persiantools>=5.2,<6",
  "python-bidi>=0.6,<1",
  "python-dotenv>=1,<2",
  "requests>=2.32,<3",
  "paramiko>=4,<5",
]
legacy-db = [
  "mysql-connector-python>=9.5,<10",
  "psycopg2-binary>=2.9,<3",
  "pyodbc>=5.2,<6",
]
dev = [
  "build>=1.3,<2",
  "mypy>=1.18,<2",
  "pip-audit>=2.9,<3",
  "pytest>=9,<10",
  "pytest-asyncio>=1.3,<2",
  "pytest-cov>=7,<8",
  "ruff>=0.14,<1",
]

[project.scripts]
platform-bot = "telegram_bot_platform.telegram.bot:main"
platform-web = "telegram_bot_platform.web.app:main"
platform-worker = "telegram_bot_platform.workers.main:main"
platform-migrate = "scripts.migrate:main"
platform-import = "scripts.import_json:main"
platform-bootstrap-admin = "scripts.bootstrap_admin:main"
platform-run-compat = "scripts.run_compat:main"
platform-validate = "scripts.validate_platform:main"

[tool.hatch.build.targets.wheel]
packages = ["src/telegram_bot_platform", "scripts"]
[tool.hatch.build.targets.wheel.force-include]
"resources" = "resources"
"frontend" = "frontend"
"migrations" = "migrations"
"docs" = "docs"

[tool.hatch.build.targets.sdist]
include = ["src", "scripts", "migrations", "frontend", "resources", "tests", "docs", "README.md", "LICENSE", "VERSION", "pyproject.toml"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations", "src/telegram_bot_platform/compat"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
exclude = ["^migrations/", "^src/telegram_bot_platform/compat/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --disable-warnings --maxfail=1"
