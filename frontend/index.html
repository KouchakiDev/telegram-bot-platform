<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <meta name="color-scheme" content="light dark">
  <title>Telegram Platform</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div id="app-shell" class="shell">
    <header class="topbar">
      <div class="brand-wrap">
        <button id="menu-button" class="icon-button mobile-only" type="button" aria-label="Open navigation">
          <span></span><span></span><span></span>
        </button>
        <div class="brand-mark" aria-hidden="true">TP</div>
        <div>
          <div class="brand-title">Telegram Platform</div>
          <div id="page-subtitle" class="brand-subtitle">Operations Console</div>
        </div>
      </div>
      <div class="top-actions">
        <span id="connection-pill" class="pill pill-muted">Connecting</span>
        <button id="close-button" class="ghost-button" type="button">Close</button>
      </div>
    </header>

    <div class="app-layout">
      <aside id="sidebar" class="sidebar" aria-label="Primary navigation">
        <nav id="nav-list" class="nav-list"></nav>
        <div class="sidebar-footer">
          <div id="identity-card" class="identity-card">
            <div id="avatar" class="avatar">U</div>
            <div class="identity-text">
              <strong id="identity-name">User</strong>
              <span id="identity-role">Member</span>
            </div>
          </div>
          <button id="logout-button" class="sidebar-action" type="button">Sign out</button>
        </div>
      </aside>

      <main id="main-content" class="main-content" tabindex="-1">
        <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>
        <div id="view-root"></div>
      </main>
    </div>

    <div id="loading-overlay" class="loading-overlay hidden" aria-hidden="true">
      <div class="spinner"></div>
      <div id="loading-text">Loading…</div>
    </div>

    <dialog id="content-dialog" class="modal">
      <form id="content-form" method="dialog" class="modal-card">
        <div class="modal-header">
          <div>
            <div id="content-dialog-eyebrow" class="eyebrow">Content</div>
            <h2 id="content-dialog-title">Create content</h2>
          </div>
          <button id="content-dialog-close" class="icon-button" type="button" aria-label="Close dialog">×</button>
        </div>
        <input id="content-id" type="hidden">
        <label>
          Title
          <input id="content-title" name="title" maxlength="255" required autocomplete="off">
        </label>
        <label>
          Body
          <textarea id="content-body" name="body" rows="10" maxlength="50000" required></textarea>
        </label>
        <div class="modal-actions">
          <button id="content-cancel" class="secondary-button" type="button">Cancel</button>
          <button class="primary-button" type="submit">Save</button>
        </div>
      </form>
    </dialog>

    <dialog id="reply-dialog" class="modal">
      <form id="reply-form" method="dialog" class="modal-card">
        <div class="modal-header">
          <div>
            <div class="eyebrow">Automation</div>
            <h2 id="reply-dialog-title">Create auto reply</h2>
          </div>
          <button id="reply-dialog-close" class="icon-button" type="button" aria-label="Close dialog">×</button>
        </div>
        <input id="reply-id" type="hidden">
        <div class="form-grid two-columns">
          <label>
            Trigger
            <input id="reply-trigger" maxlength="255" required autocomplete="off">
          </label>
          <label>
            Match mode
            <select id="reply-mode" required>
              <option value="contains">Contains</option>
              <option value="exact">Exact</option>
              <option value="regex">Regex</option>
            </select>
          </label>
        </div>
        <label>
          Response
          <textarea id="reply-response" rows="8" maxlength="50000" required></textarea>
        </label>
        <label>
          Priority
          <input id="reply-priority" type="number" min="0" max="100000" value="100" required>
        </label>
        <label class="switch-row">
          <span>Enabled</span>
          <input id="reply-enabled" type="checkbox" checked>
        </label>
        <div class="modal-actions">
          <button id="reply-cancel" class="secondary-button" type="button">Cancel</button>
          <button class="primary-button" type="submit">Save</button>
        </div>
      </form>
    </dialog>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
